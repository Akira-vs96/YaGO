<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1030' viewBox='0 0 1600 1030' role='img'><title>00 — Жалпы шолу</title><rect width='1600' height='1030' fill='white'/>
<text x='50' y='71' font-family='Arial, sans-serif' font-size='36' font-weight='normal' text-anchor='start' fill='#23364D'>YaGo — жүйенің 6 негізгі процесі</text>
<text x='50' y='112' font-family='Arial, sans-serif' font-size='22' font-weight='normal' text-anchor='start' fill='#23364D'>Жобалық модель · шолу картасы; толық деректер ағындары келесі беттерде</text>
<rect x='50' y='170' width='710' height='125' rx='18' fill='#EAF7F6' stroke='#23364D' stroke-width='2'/>
<text x='405' y='226.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>1.0</text>
<text x='405' y='254.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>Пайдаланушыны тексеру</text>
<text x='60' y='334' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='start' fill='#23364D'>Кім кірді және қандай құқығы бар?</text>
<rect x='830' y='170' width='710' height='125' rx='18' fill='#EAF7F6' stroke='#23364D' stroke-width='2'/>
<text x='1185' y='226.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>2.0</text>
<text x='1185' y='254.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>Сұранымды қабылдау</text>
<text x='840' y='334' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='start' fill='#23364D'>Клиент қандай қызмет сұрады?</text>
<rect x='50' y='415' width='710' height='125' rx='18' fill='#EAF7F6' stroke='#23364D' stroke-width='2'/>
<text x='405' y='471.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>3.0</text>
<text x='405' y='499.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>Бағыт пен ресурсты таңдау</text>
<text x='60' y='579' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='start' fill='#23364D'>Кім орындайды немесе қай техника беріледі?</text>
<rect x='830' y='415' width='710' height='125' rx='18' fill='#EAF7F6' stroke='#23364D' stroke-width='2'/>
<text x='1185' y='471.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>4.0</text>
<text x='1185' y='499.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>Қызметті орындау</text>
<text x='840' y='579' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='start' fill='#23364D'>Мәртебе мен техниканың жауабын бақылау</text>
<rect x='50' y='660' width='710' height='125' rx='18' fill='#EAF7F6' stroke='#23364D' stroke-width='2'/>
<text x='405' y='716.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>5.0</text>
<text x='405' y='744.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>Қызметті аяқтау</text>
<text x='60' y='824' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='start' fill='#23364D'>Нәтижені сақтау және клиентке көрсету</text>
<rect x='830' y='660' width='710' height='125' rx='18' fill='#EAF7F6' stroke='#23364D' stroke-width='2'/>
<text x='1185' y='716.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>6.0</text>
<text x='1185' y='744.5' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='middle' fill='#23364D'>Тарифтер мен паркті басқару</text>
<text x='840' y='824' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='start' fill='#23364D'>Әкімші тарифтер мен техника деректерін өзгертеді</text>
<text x='50' y='951' font-family='Arial, sans-serif' font-size='21' font-weight='normal' text-anchor='start' fill='#23364D'>E — сыртқы қатысушы / жүйе; D — деректер қоймасы; 1.0–6.0 — процестер.</text>
<text x='50' y='991' font-family='Arial, sans-serif' font-size='21' font-weight='normal' text-anchor='start' fill='#23364D'>Әр бетте: сол жақта — кіріс деректері, ортасында — процесс, оң жақта — шығыс деректері.</text>
</svg>
