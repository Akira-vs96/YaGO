<text x='45' y='784' font-family='Arial, sans-serif' font-size='19' font-weight='normal' text-anchor='start' fill='#23364D'>Бірдей E / D нөмірі — бір объект. Басқа процестермен байланыс олардың нөмірі арқылы көрсетілген.</text>
<text x='45' y='821' font-family='Arial, sans-serif' font-size='19' font-weight='normal' text-anchor='start' fill='#23364D'>Бұл — бір DFD моделінің бөліктері. Беттер орындалу уақытын немесе міндетті кезекті белгілемейді.</text>
<text x='45' y='864' font-family='Arial, sans-serif' font-size='19' font-weight='normal' text-anchor='start' fill='#23364D'>Құлып эмуляторы — самокат / велосипед үшін. Жүргізуші / курьер — такси / жеткізу үшін.</text>
