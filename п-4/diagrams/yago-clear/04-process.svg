<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='910' viewBox='0 0 1600 910' role='img'><title>4 — Қызметті орындау</title><rect width='1600' height='910' fill='white'/>
<text x='45' y='64' font-family='Arial, sans-serif' font-size='34' font-weight='normal' text-anchor='start' fill='#23364D'>4.0  Қызметті орындау</text>
<text x='45' y='107' font-family='Arial, sans-serif' font-size='22' font-weight='normal' text-anchor='start' fill='#23364D'>Мәртебе мен техниканың жауабын бақылау</text>
