<text x='1112.5' y='506' font-family='Arial, sans-serif' font-size='17' font-weight='normal' text-anchor='middle' fill='#23364D'>Нәтиже, есептелген құн</text>
<text x='45' y='659' font-family='Arial, sans-serif' font-size='19' font-weight='normal' text-anchor='start' fill='#23364D'>Бірдей E / D нөмірі — бір объект. Басқа процестермен байланыс олардың нөмірі арқылы көрсетілген.</text>
<text x='45' y='696' font-family='Arial, sans-serif' font-size='19' font-weight='normal' text-anchor='start' fill='#23364D'>Бұл — бір DFD моделінің бөліктері. Беттер орындалу уақытын немесе міндетті кезекті белгілемейді.</text>
<text x='45' y='739' font-family='Arial, sans-serif' font-size='19' font-weight='normal' text-anchor='start' fill='#23364D'>Есептелген құн төлем жасалғанын немесе фискалдық чек берілгенін білдірмейді.</text>
