<text x='1112.5' y='381' font-family='Arial, sans-serif' font-size='17' font-weight='normal' text-anchor='middle' fill='#23364D'>Өзгерту нәтижесі</text>
<text x='45' y='534' font-family='Arial, sans-serif' font-size='19' font-weight='normal' text-anchor='start' fill='#23364D'>Бірдей E / D нөмірі — бір объект. Басқа процестермен байланыс олардың нөмірі арқылы көрсетілген.</text>
<text x='45' y='571' font-family='Arial, sans-serif' font-size='19' font-weight='normal' text-anchor='start' fill='#23364D'>Бұл — бір DFD моделінің бөліктері. Беттер орындалу уақытын немесе міндетті кезекті белгілемейді.</text>
<text x='45' y='614' font-family='Arial, sans-serif' font-size='19' font-weight='normal' text-anchor='start' fill='#23364D'>Қоймаға бағытталған жебе — жазу; қоймадан шыққан жебе — оқу.</text>
</svg>
