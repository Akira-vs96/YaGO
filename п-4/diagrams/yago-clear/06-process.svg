<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='660' viewBox='0 0 1600 660' role='img'><title>6 — Тарифтер мен паркті басқару</title><rect width='1600' height='660' fill='white'/>
<text x='45' y='64' font-family='Arial, sans-serif' font-size='34' font-weight='normal' text-anchor='start' fill='#23364D'>6.0  Тарифтер мен паркті басқару</text>
<text x='45' y='107' font-family='Arial, sans-serif' font-size='22' font-weight='normal' text-anchor='start' fill='#23364D'>Әкімші тарифтер мен техника деректерін өзгертеді</text>
<text x='45' y='170' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='start' fill='#23364D'>КІРІС: қандай дерек келеді?</text>
<text x='1185' y='170' font-family='Arial, sans-serif' font-size='20' font-weight='normal' text-anchor='start' fill='#23364D'>ШЫҒЫС: не жіберіледі?</text>
